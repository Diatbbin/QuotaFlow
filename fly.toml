# fly.toml app configuration file generated for quotaflow on 2026-05-30T23:03:14+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'quotaflow'
primary_region = 'sin'

[build]
  [build.args]
    GO_VERSION = '1.26.3'

[env]
  DB_DRIVER = 'postgres'
  SERVER_ADDRESS = '0.0.0.0:8080'
  ACCESS_TOKEN_DURATION = '15m'
  EMAIL_SENDER_NAME = 'QuotaFlow'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
